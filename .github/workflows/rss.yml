name: Generate Feeds

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external-trigger]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clear cache
        run: rm -rf cache/*

      - name: Generate feeds (local only)
        run: npm run static

      # ---------------------------------------------------------
      # 🔥 CONFRONTO GUID: SE NON CI SONO NOVITÀ, STOPPA TUTTO
      # ---------------------------------------------------------
      - name: Compare latest GUIDs
        id: compare
        run: |
          echo "Checking for updates..."
          CHANGED=0

          for FEED in grsicilia gr3 primapagina radio3mondo; do
            echo "Checking $FEED..."

            # Scarica feed pubblicato
            curl -s https://ric-82.github.io/raiplaysound-feed/rss/programmi/$FEED.xml -o old_$FEED.xml || true

            # Estrai primo GUID del feed pubblicato
            OLD_GUID=$(grep -m1 "<guid" old_$FEED.xml | sed -e 's/.*<guid[^>]*>//' -e 's/<\/guid>.*//')

            # Estrai primo GUID del feed appena generato
            NEW_GUID=$(grep -m1 "<guid" out/rss/programmi/$FEED.xml | sed -e 's/.*<guid[^>]*>//' -e 's/<\/guid>.*//')

            echo "OLD: $OLD_GUID"
            echo "NEW: $NEW_GUID"

            [ "$OLD_GUID" != "$NEW_GUID" ] && CHANGED=1
          done

          if [ "$CHANGED" -eq 0 ]; then
            echo "NO_CHANGES=1" >> $GITHUB_ENV
            echo "No new episodes detected."
          else
            echo "NO_CHANGES=0" >> $GITHUB_ENV
            echo "New episodes detected."
          fi

      # ---------------------------------------------------------
      # 🔥 COMMIT SOLO SE CI SONO NOVITÀ
      # ---------------------------------------------------------
      - name: Commit updated cache
        if: env.NO_CHANGES != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f cache/
          git restore --staged README.md
          git diff --cached --quiet || git commit -m "Update cache"
          git push

      # ---------------------------------------------------------
      # 🔥 DEPLOY SOLO SE CI SONO NOVITÀ
      # ---------------------------------------------------------
      - name: Upload Pages artifact
        if: env.NO_CHANGES != '1'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        if: env.NO_CHANGES != '1'
        uses: actions/deploy-pages@v5
